<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>换蛋巡查与提醒 · 增量审核</title>
<base href="../../2026-11-15/换蛋撮合原型/editor/">
<link rel="icon" href="data:,"><link rel="stylesheet" href="../../../docs/prototypes/shared/toolbox-shell.css"><link rel="stylesheet" href="../shared/matching.css"><link rel="stylesheet" href="../../../docs/prototypes/shared/toolbox-modal.css"><link rel="stylesheet" href="../shared/feedback17.css">
<style>.bot-fact{font-size:10px;color:#64748b;border-top:1px solid #f1f5f9;padding-top:5px;margin-top:7px}.bot-code{font:600 22px/1.6 ui-monospace,monospace;letter-spacing:2px;text-align:center;background:#f8fafc;border-radius:8px;padding:8px}.bot-setting{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;padding:10px 0;border-bottom:1px solid #f1f5f9}.bot-setting:last-child{border:0}.bot-status{color:#64748b;font-size:11px}.review-bar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;font-size:11px}.review-bar button,.review-bar select{font:inherit;min-height:28px;border:1px solid #e2e8f0;background:white;border-radius:6px;padding:0 7px}.review-bar button{color:#047857}.toolbox-modal-body .bot-copy{font-size:12px;line-height:1.7;color:#475569;margin:4px 0}</style></head><body>
<div class="prototype-toolbar"><span>巡查增量审核</span><button data-width="375">375</button><button data-width="390" aria-pressed="true">390</button><select id="demoState" aria-label="演示状态"><option value="normal">常态</option></select></div>
<div class="review-bar"><button id="reviewSettings">接入弹窗</button><button id="reviewTasks">任务状态</button><select id="patrolState" aria-label="巡查演示状态"><option value="normal">已巡查</option><option value="produced">已产出并提醒</option><option value="ambiguous">待分配</option><option value="failed">提醒失败</option><option value="quota">今日额度用完</option><option value="quiet">夜间暂停</option></select></div>
<main id="app" class="prototype-device" aria-label="巡查增量原型"></main><p class="prototype-caption">新增部分审核 · 示例状态 · 沿用已审外壳和卡片</p>
<script src="../../../docs/prototypes/shared/toolbox-shell.js"></script><script src="../shared/matching-model.js"></script><script src="../shared/task-sort.js"></script><script src="../shared/matching-view.js"></script>
<script>
(()=>{const P=window.Prototype,S=P.shell;let connected=false,code=false;const btn=(text,action,kind='primary')=>'<button type="button" class="action-btn '+kind+'" data-review="'+action+'">'+text+'</button>';
function content(){return '<div class="content-stack"><div class="bot-setting"><strong>换蛋提醒</strong><span class="pill '+(connected?'green':'gray')+'">'+(connected?'已接入':'未接入')+'</span></div>'+(connected?'<div class="bot-setting"><span>QQ群</span><span class="bot-status">123456789</span></div>':'')+'<div class="bot-setting"><span>家园巡查</span><span class="bot-status">08:00–24:00 · 每半小时</span></div><div class="bot-setting"><span>今日查询</span><span class="bot-status">12 / 100</span></div>'+(code&&!connected?'<div class="bot-code">ABCD-EFGH-JKLM</div><p class="bot-copy">10 分钟内由QQ群管理员发送：</p><code class="bot-copy">rc换蛋接入 ABCD-EFGH-JKLM</code>'+btn('复制群命令','copy','secondary'):'')+(connected?btn('断开群关联','disconnect','danger'):btn(code?'重新生成接入码':'生成接入码','generate'))+'</div>'}
function open(){S.openModal({title:'机器人接入',render:content})}
function refresh(){S.closeModal();open()}
document.getElementById('reviewSettings').onclick=open;document.getElementById('reviewTasks').onclick=()=>{P.trades.find(t=>t.id==='t-custom').placed=true;S.closeAllModals();P.openTrades();decorate()};
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-group-settings')){e.stopImmediatePropagation();open();return}const a=b.dataset.review;if(!a)return;if(a==='generate'){code=true;refresh()}if(a==='copy'){navigator.clipboard?.writeText('rc换蛋接入 ABCD-EFGH-JKLM');S.toast('已复制群命令')}if(a==='disconnect'){S.openModal({title:'断开群关联',render:()=>'<div class="content-stack"><p class="bot-copy">断开本小组的QQ群提醒？</p>'+btn('确认断开','confirm-disconnect','danger')+'</div>'})}if(a==='confirm-disconnect'){connected=false;code=false;S.closeAllModals();open()}},true);
const demo=document.createElement('button');demo.textContent='模拟群内接入成功';demo.onclick=()=>{connected=true;code=false;S.closeAllModals();open()};document.querySelector('.review-bar').append(demo);
function decorate(){const states={normal:'08:30 已巡查',produced:'09:00 发现产出 · 已提醒',ambiguous:'09:00 发现产出 · 待分配',failed:'09:00 发现产出 · 提醒失败',quota:'今日巡查额度已用完',quiet:'夜间暂停 · 08:00 恢复'};document.querySelectorAll('[data-trade-id]').forEach(card=>{const trade=P.trades.find(t=>t.id===card.dataset.tradeId);if(!trade||trade.type!=='custom'||trade.status!=='accepted')return;let fact=card.querySelector('.bot-fact');if(!fact){fact=document.createElement('div');fact.className='bot-fact';const actions=card.querySelector('.trade-actions');if(actions)card.insertBefore(fact,actions);else card.append(fact)}fact.textContent=states[document.getElementById('patrolState').value]})}
document.getElementById('patrolState').onchange=decorate;new MutationObserver(records=>{if(records.some(r=>[...r.addedNodes].some(n=>n.nodeType===1&&!n.classList.contains('bot-fact'))))decorate()}).observe(document.getElementById('app'),{childList:true,subtree:true});
})();</script></body></html>
