<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小组页方案 v2 · 我缺的三分区</title>
<style>
  :root{
    --emerald:#059669; --emerald-bg:#ecfdf5; --emerald-border:#10b981;
    --slate-700:#334155; --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1;
    --rose:#e11d48; --rose-ring:#fda4af; --rose-bg:#fff1f2;
    --amber:#b45309; --amber-bg:#fffbeb;
    --line:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#f1f5f9; color:var(--slate-700);
    font-family:-apple-system,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{width:390px; margin:0 auto; padding:14px; display:flex; flex-direction:column; gap:10px;}
  .card{background:#fff; border-radius:16px; padding:12px; box-shadow:0 1px 2px rgba(15,23,42,.08);}
  .demo-label{display:flex; align-items:baseline; gap:6px; font-size:11px; font-weight:600; color:var(--slate-500);}
  .demo-label span{font-size:9px; font-weight:400; color:var(--slate-400);}
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:6px;}
  .pet{min-height:64px; border-radius:8px; background:#f8fafc; padding:6px 7px; display:flex; flex-direction:column; gap:3px; position:relative;}
  .pet .name{font-size:12px; font-weight:500; color:var(--slate-700); line-height:1.25; word-break:break-all; padding-right:34px;}
  .pet .name small{font-size:10px; font-weight:400; color:var(--slate-400);}
  .pet .who{font-size:10px; line-height:1.3; color:#047857; word-break:break-all;}
  .pet .who.red{color:var(--rose);}
  .pet .holder{color:var(--slate-500); font-weight:500;}
  .pet .who.gray{color:var(--slate-400);}
  .pet .nature{position:absolute; top:6px; right:6px; background:var(--emerald-bg); color:#047857; font-size:9px; line-height:1.2; padding:2px 4px; border-radius:3px;}
  .pet .demand{font-size:9px; color:var(--slate-500); line-height:1.3;}
  .pet .demand b{color:#047857; font-weight:500;}
  .pet .demand button{border:1px solid var(--line); background:#fff; color:var(--slate-500); border-radius:4px; font-size:9px; height:18px; padding:0 4px;}
  .pet.blocked{background:#fff; box-shadow:inset 0 0 0 1px var(--rose-ring);}
  .pet.blocked .hint{font-size:9px; color:var(--rose); line-height:1.3;}
  .pet.selected{background:var(--emerald-bg); box-shadow:inset 0 0 0 1px var(--emerald-border);}
  .pet.selected .pick{font-size:9px; color:#047857; font-weight:500;}
  .pet.disabled{opacity:.65;}
  .section-head{margin:2px 0 0; padding-top:8px; border-top:1px dashed #e2e8f0; display:flex; align-items:baseline; gap:6px;}
  .section-title{font-size:11px; font-weight:600; color:var(--rose);}
  .section-sub{font-size:9px; color:var(--slate-400); line-height:1.35; margin-top:2px;}
  .note{font-size:10px; color:var(--slate-500); background:#fff; border-radius:10px; padding:8px 10px; line-height:1.5; border:1px solid var(--line);}
  .note b{color:var(--slate-700);}
</style>
</head>
<body>
<div class="page">

  <div class="note">
    <b>我缺的 · 只分两区（细节放大版，实际页面为 3 列）</b><br>
    只要组内有人发布过这颗蛋，就能发需求；组内没人发布过的沉底，用红边提醒。
  </div>

  <!-- 可补 -->
  <div class="card">
    <div class="demo-label">能发需求 <span>可勾选</span></div>
    <div class="grid2">
      <div class="pet">
        <span class="name">布鲁斯</span>
        <span class="who">有 阿甲</span>
        <span class="demand">已发需求：固执 · <b>待承接</b></span>
        <span class="nature">固执</span>
      </div>
      <div class="pet">
        <span class="name">圣剑侍从</span>
        <span class="who">有 阿甲 · 阿乙</span>
        <span class="who gray">2 人可补</span>
        <span class="nature">淘气</span>
      </div>
      <div class="pet selected">
        <span class="name">阿米亚特</span>
        <span class="who">有 阿乙</span>
        <span class="pick">已选 · 待发需求</span>
        <span class="nature">固执</span>
      </div>
      <div class="pet">
        <span class="name">苋米仔</span>
        <span class="who">有 阿甲</span>
        <span class="nature">踏实</span>
      </div>
    </div>
  </div>

  <!-- 不能发需求 -->
  <div class="card">
    <div class="demo-label" style="color:var(--rose);">组内暂时没来源 <span>沉底 · 红边</span></div>
    <div class="grid2">
      <div class="pet blocked">
        <span class="name">宝藏小狐</span>
        <span class="nature">固执</span>
      </div>
      <div class="pet blocked">
        <span class="name">蹦蹦种子<small> 彩玉球</small></span>
        <span class="nature">聪明</span>
      </div>
      <div class="pet blocked">
        <span class="name">波波螺</span>
        <span class="demand">已发需求：平和 · <b>待承接</b> <button>撤回</button></span>
      </div>
      <div class="pet blocked disabled">
        <span class="name">草头鸭</span>
        <span class="nature">开朗</span>
      </div>
    </div>
    <div class="section-sub">已经发过的需求仍可撤回 / 完成。</div>
  </div>

  <div class="note">
    <b>就两条规则</b>：白底可勾选发需求；红边沉底。「发需求」只统计白底区的条数，为 0 时禁用。
  </div>

</div>
</body>
</html>
