<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=120, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0; width: 120px; height: 120px;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #map {
    position: relative; width: 120px; height: 120px;
    border-radius: 8px; overflow: hidden; background: #0d1a26;
  }
  #map img.art { position: absolute; display: block; max-width: none; pointer-events: none; }
  /*
   * 世界层（底图 / 精灵点各一层）：只改 transform 平移，不再整段重建 DOM。
   * 220ms 线性过渡把两次坐标之间的位移补成连续移动，观感上不再是「一帧一跳」（2026-11-10）。
   */
  .layer {
    position: absolute; left: 0; top: 0; width: 0; height: 0;
    transition: transform 220ms linear; will-change: transform;
  }
  .ring {
    position: absolute; border: 1px dashed rgba(255,255,255,.75); border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(15,23,42,.35);
  }
  .radar {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, #14293c 0%, #0d1a26 72%);
  }
  .ring.soft { border: 1px solid rgba(148,163,184,.22); box-shadow: none; }
  .cross { position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: rgba(148,163,184,.14); }
  .cross.v { left: 50%; top: 0; width: 1px; height: 100%; }
  .n {
    position: absolute; left: 50%; top: 2px; transform: translateX(-50%);
    font: 8px/12px -apple-system, 'Microsoft YaHei UI', sans-serif;
    color: rgba(255,255,255,.85); background: rgba(15,23,42,.6);
    border-radius: 3px; padding: 0 3px;
  }
  .pt {
    position: absolute; border-radius: 50%; border: 1.5px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.6); box-sizing: border-box;
  }
  .pt.rare { width: 9px; height: 9px; }
  .pt.norm { width: 7px; height: 7px; }
  .pt .alert-ring {
    position: absolute; left: 50%; top: 50%; width: 17px; height: 17px;
    margin: -8.5px 0 0 -8.5px; border: 1.5px solid #f43f5e; border-radius: 50%;
    box-sizing: border-box;
  }
  .pt .alert-ring.demand { border-color: #22c55e; }
  .me {
    position: absolute; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;
    border-radius: 50%; background: #0ea5e9; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.6); box-sizing: border-box;
    transition: transform 220ms linear;
  }
  .me.est {
    background: transparent; border: 1.5px dashed #f59e0b;
    width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px;
  }
  /* 有人物朝向时把圆点换成箭头：尖端朝上（正北）再按朝向旋转（2026-11-10 用户要求） */
  .me.arrow, .me.arrow.est {
    width: 10px; height: 12px; margin: -6px 0 0 -5px;
    background: #0ea5e9; border: 0; border-radius: 0;
    clip-path: polygon(50% 0%, 100% 100%, 50% 76%, 0% 100%);
    filter: drop-shadow(0 0 2px rgba(255,255,255,.95));
    box-sizing: border-box; transform-origin: 50% 50%;
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
(function () {
  'use strict';
  // 240m 视野铺满 120px（比 300m 放大 1.25 倍）；100 世界单位 = 1 米（单位换算来自 maps.json，不写死）
  var SIZE = 120;
  var VIEW_METERS = 240;
  var DOT_RADIUS_METERS = 120;
  var KIND_PRIORITY = ['pollution', 'shiny', 'colorful', 'big', 'small', 'high', 'low'];
  var KIND_COLOR = {
    pollution: '#7c3aed', shiny: '#f59e0b', colorful: '#ec4899',
    big: '#0ea5e9', small: '#0ea5e9', high: '#059669', low: '#059669'
  };

  var catalog = null;
  var state = null;
  var root = document.getElementById('map');
  /** 底图加载失败的文件名：记下来退回雷达，避免整块留空（2026-11-09） */
  var failedArt = {};

  // ── 结构只建一次（2026-11-10）────────────────────────────────────────────
  // 以前每次 update 都 root.innerHTML = 整段 html，一秒两次全量重建 DOM；
  // 现在底图与精灵点各放一个 .layer，刷新只改 transform / 点位，重建只在切场景时发生。
  var built = false;
  var artLayer = null;
  var dotLayer = null;
  var artNode = null;
  var meNode = null;
  var dotPool = [];
  /**
   * 世界锚点：进入场景时的自身坐标。宠物与底图按它换算一次位置，
   * 之后自身移动只改 layer 的 transform —— 屏幕位置 = 中心 + (宠物 - 自身) × 比例，与锚点无关。
   */
  var anchorX = 0;
  var anchorY = 0;
  var pxPerUnit = 1;
  var unitsPerMeter = 100;
  var sceneKey = '';
  var lastHeading = 0;

  // 卡顿量化（2026-11-10）：每 5s 报一次 update / 结构重建次数 / 实际画出的精灵点数，
  // 只看数据不优化。壳里用 WebChromeClient 把这几行转进 logcat（RocoPerf）。
  var perfUpdates = 0;
  var perfRebuilds = 0;
  var perfDots = 0;
  var perfDotsMax = 0;
  var perfSince = Date.now();

  function perfLog() {
    var now = Date.now();
    if (now - perfSince < 5000) return;
    console.log('RocoPerf map 5s update=' + perfUpdates + ' rebuild=' + perfRebuilds
      + ' dots=' + perfDots + ' dotsMax=' + perfDotsMax);
    perfUpdates = 0;
    perfRebuilds = 0;
    perfDotsMax = 0;
    perfSince = now;
  }

  function colorOfKinds(kinds) {
    if (!kinds) return '#475569';
    for (var index = 0; index < KIND_PRIORITY.length; index++) {
      if (kinds.indexOf(KIND_PRIORITY[index]) >= 0) return KIND_COLOR[KIND_PRIORITY[index]];
    }
    return '#475569';
  }

  /** 雷达底图：渐变 + 十字 + 同心圈（视野半径 120m，圈距 40m，跟着 240m 视野一起缩）。 */
  function radarBackdrop(pxPerMeter) {
    var html = '<div class="radar"></div><div class="cross"></div><div class="cross v"></div>';
    var steps = [40, 80, 120];
    for (var step = 0; step < steps.length; step++) {
      var radius = steps[step] * pxPerMeter;
      html += '<div class="ring soft" style="left:' + (SIZE / 2 - radius).toFixed(1) +
        'px;top:' + (SIZE / 2 - radius).toFixed(1) + 'px;width:' + (radius * 2).toFixed(1) +
        'px;height:' + (radius * 2).toFixed(1) + 'px"></div>';
    }
    return html;
  }

  /**
   * 底图投影：世界坐标 → 图片像素。
   *
   * `side_units` 是底图覆盖的世界边长（世界单位，1 米 = 100 单位），
   * 所以「世界单位差 ÷ side_units × 图片宽度」才是图片上的位置。
   * 2026-11-09 修：以前除的是 declared_width（4096 图片像素），自身点被算到几十万像素外，
   * 整张底图平移到视口外，表现就是「地图一片深色」。
   * 自身点必须落回底图范围内，否则视为标定 / 投影异常，退回雷达（不留空白）。
   */
  function projectArt(map, selfX, selfY, pxPerUnitValue) {
    var side = Number(map.side_units);
    var originX = Number(map.origin_x);
    var originY = Number(map.origin_y);
    var declaredWidth = Number(map.declared_width) || 1;
    var declaredHeight = Number(map.declared_height) || declaredWidth;
    if (!isFinite(side) || side <= 0 || !isFinite(originX) || !isFinite(originY)) return null;
    var width = side * pxPerUnitValue;
    var height = width * (declaredHeight / declaredWidth);
    if (!isFinite(width) || !isFinite(height) || width <= 0 || height <= 0) return null;
    // y 轴与 maps.json 的 "y":"south" 一致：世界 y 越大越靠南，图片 y 向下也越大
    var imageX = (selfX - originX) / side * width;
    var imageY = (selfY - originY) / side * height;
    if (!isFinite(imageX) || !isFinite(imageY)) return null;
    var marginX = width * 0.02;
    var marginY = height * 0.02;
    if (imageX < -marginX || imageX > width + marginX
      || imageY < -marginY || imageY > height + marginY) return null;
    return {
      width: width,
      height: height,
      left: SIZE / 2 - imageX,
      top: SIZE / 2 - imageY
    };
  }

  /** 固定的雷达骨架：顺序与改动前一致（软圈 → 底图 → 120m 实线圈 + N → 精灵点 → 箭头）。 */
  function buildSkeleton() {
    var pxPerMeter = SIZE / VIEW_METERS;
    root.innerHTML = '';
    var head = document.createElement('div');
    head.innerHTML = radarBackdrop(pxPerMeter);
    while (head.firstChild) root.appendChild(head.firstChild);

    artLayer = document.createElement('div');
    artLayer.className = 'layer';
    root.appendChild(artLayer);

    var ringRadius = 120 * pxPerMeter;
    var tail = document.createElement('div');
    tail.innerHTML = '<div class="ring" style="left:' + (SIZE / 2 - ringRadius).toFixed(1) +
      'px;top:' + (SIZE / 2 - ringRadius).toFixed(1) + 'px;width:' + (ringRadius * 2).toFixed(1) +
      'px;height:' + (ringRadius * 2).toFixed(1) + 'px"></div><div class="n">N</div>';
    while (tail.firstChild) root.appendChild(tail.firstChild);

    dotLayer = document.createElement('div');
    dotLayer.className = 'layer';
    root.appendChild(dotLayer);

    meNode = document.createElement('span');
    meNode.className = 'me arrow';
    meNode.style.left = (SIZE / 2) + 'px';
    meNode.style.top = (SIZE / 2) + 'px';
    root.appendChild(meNode);

    dotPool = [];
    artNode = null;
    built = true;
  }

  /** 切场景 / 底图变化时重建底图与点池；调用方负责关掉过渡，避免锚点变化被动画成一次「滑动」。 */
  function resetScene(map, selfX, selfY) {
    anchorX = selfX;
    anchorY = selfY;
    if (artNode && artNode.parentNode) artNode.parentNode.removeChild(artNode);
    artNode = null;
    if (map && map.image && !failedArt[map.image]) {
      var art = projectArt(map, anchorX, anchorY, pxPerUnit);
      if (art) {
        var img = document.createElement('img');
        img.className = 'art';
        img.alt = '';
        img.draggable = false;
        img.src = 'maps/' + map.image;
        img.style.width = art.width.toFixed(1) + 'px';
        img.style.height = art.height.toFixed(1) + 'px';
        img.style.left = art.left.toFixed(1) + 'px';
        img.style.top = art.top.toFixed(1) + 'px';
        img.onerror = function () { artFailed(map.image); };
        artLayer.appendChild(img);
        artNode = img;
      }
    }
    for (var index = 0; index < dotPool.length; index++) {
      if (dotPool[index].parentNode) dotPool[index].parentNode.removeChild(dotPool[index]);
    }
    dotPool = [];
  }

  /**
   * 精灵点：位置只跟「宠物绝对坐标 - 锚点」有关，刷新时按索引复用节点，不再重建整段 DOM。
   *
   * 裁剪半径必须按**当前自身坐标**算，不能按锚点（2026-11-10 修复）：
   * 锚点只在切场景时更新，而壳推来的 mapPets 永远是「离我最近的 24 只」；
   * 一旦走离锚点超过 120m，整批精灵点都会被当成「太远」剔掉，表现就是
   * 列表每秒在变、地图上的精灵点却一直不动（跑得越远越明显）。
   */
  function layoutDots(selfX, selfY) {
    var pets = state.mapPets || state.pets || [];
    var used = 0;
    for (var index = 0; index < pets.length; index++) {
      var pet = pets[index];
      var petX = Number(pet.x);
      var petY = Number(pet.y);
      if (!isFinite(petX) || !isFinite(petY)) continue;
      // 视野半径按真实米数判断，避免远端精灵挤在圆圈外缘
      if (Math.hypot(petX - selfX, petY - selfY) / unitsPerMeter > DOT_RADIUS_METERS) continue;
      var size = pet.rare ? 9 : 7;
      var dot = dotPool[used];
      if (!dot) {
        dot = document.createElement('span');
        dotLayer.appendChild(dot);
        dotPool.push(dot);
      }
      dot.className = 'pt ' + (pet.rare ? 'rare' : 'norm');
      dot.style.display = '';
      dot.style.left = (SIZE / 2 + (petX - anchorX) * pxPerUnit - size / 2).toFixed(1) + 'px';
      dot.style.top = (SIZE / 2 + (petY - anchorY) * pxPerUnit - size / 2).toFixed(1) + 'px';
      dot.style.background = colorOfKinds(pet.kinds);
      // 壳端 payload 目前不带 reason，需求圈只有旧网页直连时才会出现
      dot.innerHTML = pet.reason === 'demand' ? '<span class="alert-ring demand"></span>'
        : pet.alert ? '<span class="alert-ring"></span>' : '';
      used++;
    }
    for (var rest = used; rest < dotPool.length; rest++) dotPool[rest].style.display = 'none';
    perfDots = used;
    if (used > perfDotsMax) perfDotsMax = used;
  }

  /** 自身移动 → 两层一起平移；CSS 过渡把两次推送之间补成连续移动。 */
  function moveTo(selfX, selfY) {
    var transform = 'translate(' + (-(selfX - anchorX) * pxPerUnit).toFixed(2) + 'px,' +
      (-(selfY - anchorY) * pxPerUnit).toFixed(2) + 'px)';
    artLayer.style.transform = transform;
    dotLayer.style.transform = transform;
  }

  /** 重建 / 切场景这一帧必须瞬时生效，否则会从旧锚点滑过去，看起来像地图抖一下。 */
  function withoutTransition(fn) {
    if (!artLayer) { fn(); return; }
    artLayer.style.transition = 'none';
    dotLayer.style.transition = 'none';
    if (meNode) meNode.style.transition = 'none';
    fn();
    // 读一次布局，让浏览器把「无过渡」这一帧算完再恢复过渡
    void dotLayer.offsetWidth;
    artLayer.style.transition = '';
    dotLayer.style.transition = '';
    if (meNode) meNode.style.transition = '';
  }

  function teardown() {
    root.innerHTML = '';
    built = false;
    artLayer = null;
    dotLayer = null;
    artNode = null;
    meNode = null;
    dotPool = [];
    sceneKey = '';
  }

  function render() {
    perfUpdates++;
    perfLog();
    if (!catalog || !state || !state.self) { teardown(); return; }
    var selfX = Number(state.self.x);
    var selfY = Number(state.self.y);
    if (!isFinite(selfX) || !isFinite(selfY)) { teardown(); return; }

    unitsPerMeter = Number(catalog.coordinate_units_per_meter) || 100;
    pxPerUnit = (SIZE / VIEW_METERS) / unitsPerMeter;
    var map = state.scene != null && catalog.maps ? catalog.maps[String(state.scene)] : null;
    var key = (map && map.image ? map.image : 'radar') + '|' + state.scene + '|' + unitsPerMeter;

    if (!built) buildSkeleton();
    if (key !== sceneKey) {
      sceneKey = key;
      perfRebuilds++;
      withoutTransition(function () {
        resetScene(map, selfX, selfY);
        layoutDots(selfX, selfY);
        moveTo(selfX, selfY);
      });
    } else {
      layoutDots(selfX, selfY);
      moveTo(selfX, selfY);
    }

    // 人物标识统一用箭头（2026-11-10 用户要求）：有朝向按朝向旋转，没朝向沿用上一次
    if (state.heading != null && isFinite(Number(state.heading))) lastHeading = Number(state.heading);
    meNode.className = 'me arrow' + (state.estimated ? ' est' : '');
    meNode.style.transform = 'rotate(' + lastHeading.toFixed(1) + 'deg)';
  }

  window.RocoOverlayMap = {
    /** 与网页同一份 maps.json（由壳从 assets 读入后注入）。 */
    init: function (json) {
      try { catalog = typeof json === 'string' ? JSON.parse(json) : json; }
      catch (error) { catalog = null; }
      render();
    },
    /** 附近 payload 的地图子集：{scene, self, estimated, heading, pets:[{x,y,rare,alert,kinds}]}。
     *  mapPets 含未命中目标的普通精灵；旧壳只给 pets 时仍能画。
     *  scene 没有标定底图时画雷达模式（同一投影），不再整块留空。 */
    update: function (json) {
      try { state = typeof json === 'string' ? JSON.parse(json) : json; }
      catch (error) { state = null; }
      render();
    },
    /** 底图加载失败（WebView 拦截 file 资源等）：撤掉底图退回雷达，不留空白。 */
    artFailed: function (image) {
      if (!image || failedArt[image]) return;
      failedArt[image] = true;
      if (artNode && artNode.parentNode) artNode.parentNode.removeChild(artNode);
      artNode = null;
    }
  };
})();
</script>
</body>
</html>
